modLoader = "javafml"
loaderVersion = "[4,)"
issueTrackerURL = "https://github.com/sanbo1/HandyStarters/issues"
license = "MIT"

[[mods]]
modId = "handy_starters"
version = "${version}"
displayName = "Handy Starters"
authors = "sanbo1"
description = '''
Eliminate the frustration of the early game!
'''
logoFile = "assets/handy_starters/icon.png"

[[dependencies.handy_starters]]
modId = "neoforge"
type = "required"
# The 21.1 line (MC 1.21.1) has no -beta builds; this admits 21.1.1, the first release.
versionRange = "[21.1,)"
ordering = "NONE"
side = "BOTH"

[[dependencies.handy_starters]]
modId = "minecraft"
type = "required"
# This build targets 1.21.1 only; 1.21.2 brought large API changes.
versionRange = "[1.21.1,1.21.2)"
ordering = "NONE"
side = "BOTH"

[[mixins]]
config = "handy_starters.mixins.json"
