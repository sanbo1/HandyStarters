# Done to increase the memory available to Gradle.
org.gradle.jvmargs=-Xmx2G
org.gradle.parallel=true

# Mod properties
mod_version = 1.0.0
maven_group = com.snd.handystarters
archives_name = handy_starters
enabled_platforms = fabric,neoforge

# Minecraft properties
minecraft_version = 26.3

# Dependencies
# Pinned to the oldest versions that support 26.3 (not the newest), per project policy.
# - fabric_loader_version: the floor Fabric API's own manifest declares for its 26.3 builds
# - fabric_api_version: the oldest build published for the 26.3 release (earlier +26.3
#   builds target the 26.3 snapshots, not the release)
# - neoforge_version: the first build for the 26.3 line
fabric_loader_version = 0.19.3
fabric_api_version = 0.160.5+26.3
neoforge_version = 26.3.0.0-beta
